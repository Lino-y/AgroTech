<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="leafGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2E7D32;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1B5E20;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="stemGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#388E3C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E7D32;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#F4FBF7" stroke="#C8E6C9" stroke-width="1.5"/>
  
  <!-- Leaf shape -->
  <path d="M32 12 
           C20 12, 10 20, 10 30 
           C10 38, 18 44, 26 48 
           C30 50, 34 50, 38 48 
           C46 44, 54 38, 54 30 
           C54 20, 44 12, 32 12 Z" 
        fill="url(#leafGradient)" 
        stroke="#1B5E20" 
        stroke-width="0.5"/>
  
  <!-- Leaf vein -->
  <path d="M32 16 
           C32 16, 34 24, 33 30 
           C32 36, 30 42, 28 46" 
        fill="none" 
        stroke="#1B5E20" 
        stroke-width="1.5" 
        stroke-linecap="round" 
        opacity="0.6"/>
  
  <!-- Secondary vein -->
  <path d="M32 20 
           C32 20, 38 26, 40 32 
           C41 36, 40 40, 38 43" 
        fill="none" 
        stroke="#1B5E20" 
        stroke-width="1" 
        stroke-linecap="round" 
        opacity="0.4"/>
  
  <!-- Tertiary vein -->
  <path d="M32 20 
           C32 20, 26 26, 24 32 
           C23 36, 24 40, 26 43" 
        fill="none" 
        stroke="#1B5E20" 
        stroke-width="1" 
        stroke-linecap="round" 
        opacity="0.4"/>
  
  <!-- Stem -->
  <path d="M32 48 
           C32 48, 32 54, 32 58" 
        fill="none" 
        stroke="url(#stemGradient)" 
        stroke-width="3" 
        stroke-linecap="round"/>
  
  <!-- Dot accent (tech feel) -->
  <circle cx="46" cy="18" r="3" fill="#D9A441" opacity="0.9"/>
  <circle cx="46" cy="18" r="1.5" fill="#FFFFFF" opacity="0.8"/>
</svg>
